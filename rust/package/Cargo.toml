[package]
name = "openadr3-types"
version = "3.1.0"
edition = "2021"
description = "OpenADR 3.1.0 type definitions and validation for Rust"
license = "MIT"
repository = "https://github.com/clean-energy-tools/openadr-3-types"
keywords = ["openadr", "api", "types", "validation", "openapi"]
categories = ["api-bindings", "data-structures"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
url = { version = "2.4", features = ["serde"] }
regex = "1.10"
validator = { version = "0.16", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }