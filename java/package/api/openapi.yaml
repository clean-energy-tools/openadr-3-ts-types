        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/program"
          description: OK.
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "500":
          $ref: "#/components/responses/internalServerError"
      security:
      - oAuth2ClientCredentials:
        - read_targets
      - bearerAuth: []
      summary: searches programs by program ID
      tags:
      - programs
      x-accepts:
      - application/json
    put:
      description: Update an existing program with the programID in path.
      operationId: updateProgram
      parameters:
      - description: Object ID of the program object.
        explode: false
        in: path
        name: programID
        required: true
        schema:
          $ref: "#/components/schemas/objectID"
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/programRequest"
        description: program item to update.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/program"
          description: OK.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/problem"
          description: Bad Request.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/problem"
          description: Forbidden.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/problem"
          description: Not Found.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/problem"
          description: Conflict. Implementation dependent response if program with
            the same programName exists.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/problem"
          description: Internal Server Error.
      security:
      - oAuth2ClientCredentials:
        - write_programs
      - bearerAuth: []
      summary: update a program
      tags:
      - programs
      x-content-type: application/json
      x-accepts:
      - application/json
